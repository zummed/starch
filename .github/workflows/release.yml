name: Release

# Publishing is deliberate: only a push to main (i.e. merging) releases.
# Branch pushes get tests via ci.yml, never an npm publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci

      # Build before testing: the suite includes smoke tests that run
      # against the built dist artifacts (skipped when dist is absent).
      # The playground build is needed for the CLI smoke test, and dist-app
      # ships in the npm package so the `starch` CLI has something to serve.
      - name: Build library, embed, and playground
        run: npm run build && npm run build:embed && npm run build:app

      - name: Test
        run: npm test

      # No NPM_TOKEN: publishing authenticates via OIDC Trusted Publishing.
      # Requires a trusted publisher for @bitsnbobs/starch configured on npmjs.org
      # pointing at this repo and the Release workflow.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
