name: CI

# Tests and builds for branch work and PRs. Publishing happens only in the
# Release workflow, on push to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build before testing: the suite includes smoke tests that run
      # against the built dist artifacts (skipped when dist is absent).
      - name: Build library and embed
        run: npm run build && npm run build:embed

      - name: Test
        run: npm test
